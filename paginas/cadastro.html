<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="cadastro.css" rel="stylesheet">

    <title>Document</title>
    
    <script src="cadastro.js" defer></script>
</head>  
<body>
    <section class="vh-100" style="background-color: #eee;">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-11">
        <div class="card text-black" style="border-radius: 25px;">
          <div class="card-body p-md-5">
            <div class="row justify-content-center">
              <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4 titulo">CADASTRO</p>

                <form id="formCadastro"class="mx-1 mx-md-4" novalidate>

                  <div class="d-flex flex-row align-items-center mb-4">
                    
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                      <input type="text" id="nome" class="form-control" 
                        required minlength="5" placeholder="nome" autocomplete="name"/>
                      <label class="form-label" for="nome">Seu nome</label>
                      <div id="erroNome" class="invalid-feedback"></div>
                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center mb-4">
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                      <input type="email" id="email" class="form-control" 
                        required placeholder="nome@gmail.com" autocomplete="email"/>
                      <label class="form-label" for="email">Seu email</label>
                      <div id="erroEmail" class="invalid-feedback"></div>
                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center mb-4">
                    
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                      <input type="password" id="senha" class="form-control" 
                        required minlength="8" placeholder="********"autocomplete="new-password"/>
                      <label class="form-label" for="senha">Senha</label>
                      <div class="form-text">Mínimo 8 caracteres. Números, letra maiúscula, minúscula e caractere especial</div>
                      <div id="erroSenha" class="invalid-feedback"></div>
                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center mb-4">
                    
                    <div data-mdb-input-init class="form-outline flex-fill mb-0">
                      <input type="password" id="repetirSenha" class="form-control" 
                        required placeholder="********" autocomplete="new-password"/>
                      <label class="form-label" for="repetirSenha">Repita sua senha</label>
                      <div id="erroRepetirSenha" class="invalid-feedback"></div>
                    </div>
                  </div>

                  <div class="form-check d-flex justify-content-center mb-5">
                    <input class="form-check-input me-2" type="checkbox" value="" id="termos" />
                    <label class="form-check-label" for="termos">
                      Eu concordo com todos <a href="#!">termos de serviço</a>
                    </label>
                    <div id="erroTermos" class="invalid-feedback"></div>
                  </div>

                  <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                    <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg botao-cadastro">Cadastrar-se</button>
                  </div>

                </form>

              </div>
              <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">

                <img src="TRAK LOGO.png"
                  class="img-fluid" alt="Sample image">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
