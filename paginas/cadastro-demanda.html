<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cadastro-demanda.css">

    <title>Cadastro de Demanda | TRAK</title>
</head>

<body>
    <header class="cabecalho shadow-sm">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <a class="marca" href="index.html">
                <img src="TRAK_LOGO_cortada.png" alt="TRAK">
            </a>

            <nav class="d-none d-md-flex gap-4">
                <a href="dashboard.html">Dashboard</a>
                <a href="#" class="ativo">Demandas</a>
            </nav>

            <a href="login.html" class="usuario">Sair</a>
        </div>
    </header>

    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <p class="caminho mb-1">Demandas / <span>Nova demanda</span></p>
                <h1>Cadastro de demanda</h1>
                <p class="subtitulo mb-0">
                    Preencha as informações para registrar uma nova demanda.
                </p>
            </div>

            <a href="dashboard.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>

        <form class="card formulario shadow-sm" action="#" method="post">
            <div class="card-body p-4 p-md-5">
                <section>
                    <h2>Informações da demanda</h2>
                    <p class="texto-apoio">
                        Os campos com <span class="obrigatorio">*</span> são obrigatórios.
                    </p>

                                        <div class="row g-4">
                        <div class="col-12">
                            <label for="titulo" class="form-label">
                                Título <span class="obrigatorio">*</span>
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="titulo"
                                name="titulo"
                                placeholder="Ex.: Ajustar layout da tela inicial"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="tipo" class="form-label">
                                Tipo <span class="obrigatorio">*</span>
                            </label>

                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="" selected disabled>Selecione o tipo</option>
                                <option value="tarefa">Tarefa</option>
                                <option value="defeito">Defeito</option>
                                <option value="melhoria">Melhoria</option>
                                <option value="documentacao">Documentação</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="projeto" class="form-label">
                                Projeto <span class="obrigatorio">*</span>
                            </label>

                            <select class="form-select" id="projeto" name="projeto" required>
                                <option value="" selected disabled>Selecione o projeto</option>
                                <option value="trak">Sistema TRAK</option>
                                <option value="site">Site institucional</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="descricao" class="form-label">
                                Descrição <span class="obrigatorio">*</span>
                            </label>

                            <textarea
                                class="form-control"
                                id="descricao"
                                name="descricao"
                                rows="5"
                                placeholder="Descreva o que precisa ser feito, o motivo e o resultado esperado."
                                required
                            ></textarea>
                        </div>
                    </div>
                </section>
