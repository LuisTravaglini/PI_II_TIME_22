<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="dashboard.css">

    <title>Dashboard</title>
</head>

<body>

    <div class="secao">

        <div class="cabecalho-topo">
            <img src="TRAK_LOGO_cortada.png" alt="Logo do sistema" class="logo">
            <!-- Atalho para a lista completa de demandas -->
            <a href="listagem_demanda.html" class="link-listagem">Ver todas as demandas</a>
        </div>
        <h2>Dashboard de demandas</h2>
        <!-- Mensagem de erro da API (fica vazia quando dá tudo certo) -->
        <p id="erroDashboard" class="mensagem-erro" role="alert"></p>

        <div class="cards-resumo">

            <div class="card-resumo">
                <p class="valor" id="valorTotal">-</p>
                <p class="rotulo">Total</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorAbertas">-</p>
                <p class="rotulo">Abertas</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorAndamento">-</p>
                <p class="rotulo">Em andamento</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorRevisao">-</p>
                <p class="rotulo">Em revisão</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorConcluidas">-</p>
                <p class="rotulo">Concluídas</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorCanceladas">-</p>
                <p class="rotulo">Canceladas</p>
            </div>

        </div>

    </div>


    <div class="secao">

        <div class="graficos">

            <div class="painel">
                <h3>Por prioridade</h3>

                <div id="barrasPrioridade"></div>

            </div>

            <div class="painel">
                <h3>Por tipo</h3>

                <div id="barrasTipo"></div>

            </div>

        </div>

    </div>


    <div class="secao">

        <div class="destaques">

            <div class="painel">

                <h3>Críticas em aberto</h3>

                <div id="listaCriticas"></div>

            </div>

        <div class="painel">

            <h3>Próximas do prazo</h3>

            <div id="listaPrazo"></div>

        </div>

        </div>

    </div>
    <!-- Busca os indicadores em GET /dashboard e preenche esta página -->
    <script src="dashboard.js"></script>
</body>
</html>
