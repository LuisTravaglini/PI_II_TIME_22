<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="dashboard.css">

    <title>Dashboard | TRAK</title>
</head>

<body>

    <!-- Cabeçalho fixo no topo: logo, menu de navegação, usuário logado e botão de sair -->
    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <a class="marca" href="dashboard.html">
                <img src="TRAK_LOGO_cortada.png" alt="TRAK">
            </a>

            <nav class="menu">
                <a href="dashboard.html" class="ativo">Dashboard</a>
                <a href="listagem_demanda.html">Demandas</a>
                <!-- Escondidos para o Membro da Equipe pelo dashboard.js (ele não cadastra demandas nem projetos) -->
                <a href="cadastro-demanda.html" id="linkNovaDemanda">Nova demanda</a>
                <a href="criar_projeto.html" id="linkNovoProjeto">Novo projeto</a>
            </nav>

            <div class="cabecalho-usuario">
                <!-- Nome e perfil preenchidos pelo dashboard.js com o usuário do login -->
                <div class="usuario-info">
                    <span class="usuario-nome" id="usuarioNome"></span>
                    <span class="usuario-perfil" id="usuarioPerfil"></span>
                </div>
                <a href="login.html" class="botao-sair" onclick="TRAK_AUTH.sair(); return false;">Sair</a>
            </div>
        </div>
    </header>

    <div class="secao">

        <div class="titulo-pagina">
            <h2>Dashboard de demandas</h2>
            <p class="subtitulo">Resumo das demandas dos projetos que você acompanha.</p>
        </div>
        <!-- Mensagem de erro da API (fica vazia quando dá tudo certo) -->
        <p id="erroDashboard" class="mensagem-erro" role="alert"></p>

        <div class="cards-resumo">

            <div class="card-resumo">
                <p class="valor" id="valorTotal">-</p>
                <p class="rotulo">Total</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorAbertas">-</p>
                <p class="rotulo">Abertas</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorAndamento">-</p>
                <p class="rotulo">Em andamento</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorRevisao">-</p>
                <p class="rotulo">Em revisão</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorConcluidas">-</p>
                <p class="rotulo">Concluídas</p>
            </div>

            <div class="card-resumo">
                <p class="valor" id="valorCanceladas">-</p>
                <p class="rotulo">Canceladas</p>
            </div>

        </div>

    </div>


    <div class="secao">

        <div class="graficos">

            <div class="painel">
                <h3>Por prioridade</h3>

                <div id="barrasPrioridade"></div>

            </div>

            <div class="painel">
                <h3>Por tipo</h3>

                <div id="barrasTipo"></div>

            </div>

        </div>

    </div>


    <div class="secao">

        <div class="destaques">

            <div class="painel">

                <h3>Críticas em aberto</h3>

                <div id="listaCriticas"></div>

            </div>

        <div class="painel">

            <h3>Próximas do prazo</h3>

            <div id="listaPrazo"></div>

        </div>

        </div>

    </div>
    <!-- Busca os indicadores em GET /dashboard e preenche esta página -->
    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
