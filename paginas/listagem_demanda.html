<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas - PI2</title>

    <link rel="stylesheet" href="listagem.css">
    <script src="listagem.js" defer></script>
    <script src="controle-acesso.js" defer></script>
    

</head>
<body>

    <header>
        <nav>
            <h1>Sistema de Acompanhamento de Demandas</h1>
            <a href="dashboard.html" class="btn-dashboard">
            Dashboard
            </a>
        </nav>
    </header>

    <main>
        <section class="cabecalho-pagina">
            <h2>Demandas Cadastradas</h2>
        </section>

        <!-- Os valores dos selects são os mesmos que a API aceita em GET /demandas -->
        <section class="controles-listagem">
            <div class="campo-busca">
                <input type="text" placeholder="Buscar demanda por título ou descrição..." id="busca-demanda">
                <button type="button" id="btn-buscar" class="btn-primario">Buscar</button>
            </div>

            <select id="filtro-status">
                <option value="">Filtrar por Status</option>
                <option value="aberta">Aberta</option>
                <option value="andamento">Em andamento</option>
                <option value="revisao">Em revisão</option>
                <option value="concluida">Concluída</option>
                <option value="cancelada">Cancelada</option>
            </select>

            <select id="filtro-prioridade">
                <option value="">Filtrar por Prioridade</option>
                <option value="critica">Crítica</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
            </select>

            <select id="ordenacao">
                <option value="">Ordenar por...</option>
                <option value="prioridade">Prioridade</option>
                <option value="dataCriacao">Data de criação</option>
                <option value="prazo">Prazo de finalização</option>
                <option value="status">Status</option>
            </select>
        </section>

        <!-- Erros devolvidos pela API (400, 503...) aparecem aqui -->
        <p id="erro-api" class="mensagem-erro" role="alert"></p>

        <section class="area-dados">
            <table class="tabela-demandas">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Data Criação</th>
                        <th>Prazo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <!-- As linhas são montadas pelo listagem.js com os dados do banco -->
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
